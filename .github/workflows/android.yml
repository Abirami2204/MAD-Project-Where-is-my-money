name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-email:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk JustSpent-latest.apk

    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JustSpent-APK
        path: JustSpent-latest.apk

    - name: Send Summary via Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        # We use GitHub Secrets to hide your email credentials
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_APP_PASSWORD }}
        subject: "New JustSpent Build Success! 🚀"
        to: ${{ secrets.MAIL_TO }}
        from: JustSpent Automated Builder
        body: "A new version of JustSpent has been successfully built!\n\nTo bypass Gmail's aggressive security filters, the APK has been securely uploaded to GitHub.\n\n⬇️ Download it here (Scroll to the Artifacts section at the bottom):\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
