name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk JustSpent-latest.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Development Build #${{ github.run_number }}
        files: JustSpent-latest.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Summary via Email
      uses: dawidd6/action-send-mail@v3 
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        # We use GitHub Secrets to hide your email credentials
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_APP_PASSWORD }}
        subject: "New JustSpent Build Success! 🚀"
        to: ${{ secrets.MAIL_TO }}
        from: JustSpent Automated Builder
        body: "A new version of JustSpent has been successfully built!\n\nTo ensure easy downloading directly on your mobile device, the APK has been published as a GitHub Release.\n\n⬇️ Download it here (Click 'Assets' at the bottom of the release and tap the .apk file):\nhttps://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
