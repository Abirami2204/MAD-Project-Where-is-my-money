name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-email:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk JustSpent-latest.apk

    - name: Send APK via Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        # We use GitHub Secrets to hide your email credentials
        # To send to MULTIPLE recipients, format your MAIL_TO secret with a comma!
        # Example MAIL_TO value: john@example.com,jane@example.com
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "New JustSpent Build Success! \uD83D\uDE80"
        to: ${{ secrets.MAIL_TO }}
        from: JustSpent Automated Builder
        body: "A new version of JustSpent has been successfully built from your latest commit.\n\nPlease find the APK attached."
        attachments: JustSpent-latest.apk
